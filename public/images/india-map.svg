"use client";

import Image from "next/image";
import { motion } from "framer-motion";
import { states } from "./StateData";

export default function IndiaSVG() {
  return (
    <div className="relative mx-auto w-full max-w-[520px]">

      {/* Background Glow */}
      <div className="absolute inset-0 rounded-full bg-red-600/10 blur-[120px]" />

      {/* India Map */}
      <Image
        src="/images/india-map.svg"
        alt="India Map"
        width={520}
        height={700}
        className="relative z-10 w-full"
        priority
      />

      {/* Animated Markers */}
      {states.map((state) => (
        <motion.div
          key={state.name}
          className="absolute z-20"
          style={{
            left: `${state.x}%`,
            top: `${state.y}%`,
          }}
          initial={{ scale: 0 }}
          whileInView={{ scale: 1 }}
          viewport={{ once: true }}
          whileHover={{ scale: 1.4 }}
        >
          {/* Pulse */}
          <motion.div
            animate={{
              scale: [1, 2.5, 1],
              opacity: [0.8, 0, 0.8],
            }}
            transition={{
              repeat: Infinity,
              duration: 2,
            }}
            className="absolute h-5 w-5 -translate-x-1/2 -translate-y-1/2 rounded-full bg-red-500"
          />

          {/* Dot */}
          <div className="relative h-4 w-4 rounded-full border-2 border-white bg-red-500 shadow-[0_0_20px_rgba(255,53,94,0.9)]" />

          {/* Label */}
          <div className="mt-2 whitespace-nowrap rounded-xl border border-red-500/20 bg-black/70 px-3 py-1 text-xs text-white backdrop-blur-md">
            {state.name}
          </div>
        </motion.div>
      ))}
    </div>
  );
}